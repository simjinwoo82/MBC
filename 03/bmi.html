      // #속성이 있는 요소는 변수로 사용가능
      //=>권장x
          function check(){
          const h = height.value;
          const w = weight.value;
          const ideal = (h - 100) * 0.9;
          if (w >ideal){ 
            result.textContent = "몸무게 이상"
            }
          if (w==ideal){ 
            result.textContent = "몸무게 좋아"
            }
          if (w <ideal){ 
            result.textContent = "몸무게 미달"
            }
        }
    </script>
