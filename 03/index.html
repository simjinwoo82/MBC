<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figma Design | 100% Match</title>
    <!-- Pretendard CDN -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="home-frame" class="home-frame fade-in">
        <!-- Action Sheet -->
        <div class="action-sheet" data-node-id="636:101">
            <!-- Background & Shadow Layers -->
            <div class="sheet-bg-layers">
                <div class="fill-shadow"></div>
                <div class="glass-effect"></div>
            </div>

            <!-- Content -->
            <div class="sheet-content">
                <div class="title-desc-group" data-node-id="636:103">
                    <div class="sheet-title" data-node-id="636:104">A Short Title Is Best</div>
                    <div class="sheet-desc" data-node-id="636:105">A description should be a short, complete sentence.</div>
                </div>

                <div class="button-group" data-node-id="636:106">
                    <button class="action-btn destructive" data-node-id="636:107">Action 1</button>
                    <button class="action-btn" data-node-id="636:108">Action 2</button>
                    <button class="action-btn" data-node-id="636:109">Action 3</button>
                    <button class="action-btn" data-node-id="636:110">Action 4</button>
                    <button class="action-btn" data-node-id="636:111">Action 5</button>
                    <button class="action-btn" data-node-id="636:112">Action 6</button>
                    <button class="action-btn" data-node-id="636:113">Action 7</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Sub-page link for MPA requirement -->
    <div class="navigation-hint">
        <a href="about.html">About 페이지로 이동</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
