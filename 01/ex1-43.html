<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>셀병합하기</title>
    <style>
        table, tr, td {
            border: 1px solid black; /* 테두리 색상을 명시해주는 것이 좋습니다 */
            border-collapse: collapse; /* 선이 겹치지 않고 깔끔하게 나오도록 추가 */
            padding: 8px; /* 셀 내부 여백 추가 */
            text-align: center;
        }
            table,tr,td{
            border: 1px solid;
        }
    </style> <!-- </style> 태그가 누락되어 있어서 수정했습니다 -->
</head>
<body>
    <!-- 2행 3열의 표를 만드세요 -->
    <table>
        <tr>
            <!-- colspan="3"으로 3개의 열을 하나로 병합 -->
            <td colspan="3">1</td>
        </tr>
        <tr>
            <td>2</td>
            <td>3</td>
            <td>4</td>
        </tr>
    </table>

    <hr/>

    <table>
        <tr>
            <td rowspan="3">1</td>
            <td>2</td>
            <td>3</td>
        </tr>
        <tr>
            <td>4</td>
            <td>5</td>
        </tr>
        <tr>
            <td>6</td>
            <td>7</td>
        </tr>
    </table>
</body>
</html>
