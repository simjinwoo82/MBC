<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>div</title>
    <!-- 웹표준 html5(중), css3(한), es6(일) -->
    <style>
        .wrap{
            width: 300px;
             margin: auto;
             background-color: aqua;
        }
      header {
        width: 300px;
        border: 1px solid;
      }
      section {
        width: 300px;
        border: 1px solid;
      }
      footer {
        width: 300px;
        border: 1px solid;
      }
    </style>
  </head>
  <body>
    <!-- header+section+footer -->
    <!-- .,# -->
    <!-- 태그: 식별용 속성 두가지
           id:기능용
           class:디자인용
           div:그룹을 표시한는 태그 -->
    <!-- 헤드는 기계만 볼수 있음
          헤더는 바디안에서 볼수 있음 -->
    <div class="wrap">
      <header>헤더</header>
      <section>
        <h2>semantic 태그</h2>
        섹션
      </section>
      <footer>푸터</footer>
    </div>
  </body>
</html>
