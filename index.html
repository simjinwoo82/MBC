<!doctype html>
<html lang="ko">
  <head>

    <link rel="icon" type="image/svg+xml" href="./02/imgs/favicon.svg" />
    <title>심진우의 홈페이지</title>
    <style>
      @font-face {
        font-family: "Presentation";

        font-weight: 100;
        font-display: swap;
      }

      body {
        font-size: 40px;
        font-family: "Presentation", sans-serif;
        font-weight: 100; /* 폰트 파일(Thin)에 맞춰 100으로 수정 */

      }

      /* 링크 호버 효과 클래스 */
      .t1 {
        text-decoration: none;
        color: black;
        transition: all 0.3s ease;
      }

      .t1:hover {
        color: red;
        font-weight: 200; /* 호버 시 약간 두꺼워지게 설정 */
      }

      h2 {
        background-color: aqua;
        padding: 5px 10px;
        display: inline-block;
      }

      ul {
        list-style-type: square;
      }

      li {
        margin-bottom: 10px;
      }

      section {
        margin-bottom: 40px;
      }

      img {
        max-width: 100%;
        height: auto;
        margin: 10px;
        border: 1px solid #ccc;
      }
