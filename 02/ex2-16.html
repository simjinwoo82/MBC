<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>동적 관련 가상 클래스 선택자</title>
    <style>
        input:hover {
            border: 3px solid red;
            background: pink;
        }
        input:focus {
            border: none;
            outline: 4px dashed green;
            background: red;
            color: white;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>동적 관련 가상 클래스 선택자</h1>
        <h2>로그인</h2>
        <div class="form-box">
            <div class="form-group">
                <label for="user-id">아이디</label>
                <input type="text" id="user-id">
            </div>
            <div class="form-group">
                <label for="user-pw">비밀번호</label>
                <input type="password" id="user-pw">
            </div>
            <button type="button">login</button>
        </div>
    </div>
</body>
</html>
