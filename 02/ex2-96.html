<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
  .item { 
  width: 200px; 
  height: 100px; 
  background: url(./imgs/bg.jpg); 
  color: white; 
  text-align: center; 
  line-height: 100px; 
  cursor: pointer; 
  transition-property: transform;
  transition-duration: 1s;
  transition-timing-function: linear(0, 0.528 7%, 0.921 14.4%, 1.07 18.3%, 1.19 22.4%, 1.28 26.7%, 1.34 31.2%, 1.366 34.5%, 1.378 38%, 1.377 41.7%, 1.363 45.6%, 1.308 53.3%, 1.13 71.3%, 1.059 80.1%, 1.013 89.7%, 1);
  }
  .item:hover{
    transform: scale(1.2);}
  .item:hover+.drop {
    /* display: block; */
    opacity: 1;
  }  
  .drop {
    width: 100px;
    height: 100px;
    background: url(./imgs/bg_sun.png);
    /* display: none; */
    opacity: 0;
    transition-property: opacity;
    transition-duration: 1s;
  }
  
</style>
</head>
<body>
  <div class="container">
  <div class="item">Hover Me</div>
  <div class="drop"></div>
  
</div>
</body>
</html>
