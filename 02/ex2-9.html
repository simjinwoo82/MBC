    }

        color: blue;

    <div class="blue_text">
        <p>7월의 여행지</p>

            <li>1주차 여행지</li>
            <li>2주차 여행지</li>
        </ul>
    </div>
    <p class="여행">내년의 여행지</p>
    
</body>
