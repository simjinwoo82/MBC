<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .card-container {
      perspective: 1000px;
    }
    .card {
      width: 200px;
      height: 300px;
      transition: all 0.6s;
      transform-style: preserve-3d;
      position: relative;
    }
    .front,
    .back {
      position: absolute;
      background: #3498db;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
    }
    .card:hover {
      transform: rotatey(180deg);
    }
    .back {
      /* https://grabient.com/HQNgTAHANMAsEFYZjLKBaADMAzARmi2DAE4QZYTDtY8wNswQSY8B2cvXJh4BE+ui6ZMOIA?style=angularSwatches&angle=210&steps=15 */
      background: #e74c3c;
      transform: rotateY(180deg);
    }
  </style>
</head>
<body>
  <div class="card-container">
  <div class="card">
    <div class="front">Front</div>
    <div class="back">Back</div>
  </div>
</div>
</body>
</html>
