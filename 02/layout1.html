<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css" integrity="sha512-Y8E0+0z1QC4meLTAeOJ9NqHJYlM0VQ4T3yGWxlWd6m0iPjYksj+9Qw0SAzTbDpVVq6Dogjtv0fBOfMu7IkCByw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
      .cont {
        display: grid;
      grid-template-areas: 
      "box1 box2"
      "box3 box4";
      }
      .item:nth-child(1) {
        grid-area: box1;
        background: grey;
      }
      .item:nth-child(2) {
        grid-area: box2;
        background: red;
      }       
      .item:nth-child(3) {
        grid-area: box3;
        background:green;
      }  
      .item:nth-child(4) {
        grid-area: box4;
        background: yellow;
      } 

    .item {
      width: 50%;
      height: 100px;
    
  
    }

    </style>
  </head>
  <body>
    <div class="cont">
      <div class="item">1</div>
      <div class="item">2</div>
      <div class="item">3</div>
      <div class="item">4</div>
    </div>
  </body>
</html>
