<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>position absolute & relative</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    .parent { width: 300px; height: 300px; background: #eee; }
    .child { 
      width: 100px; 
      height: 100px; 
      background: rgba(255,0,0,0.5);
      border: 8px solid;
      box-sizing: border-box; 
    }
    .child:nth-child(2) {
      background: rgba(17, 212, 17, 0.5);
    }
    .child:nth-child(3) {
      background: rgba(0, 0, 255, 0.5);
    }
    .child::before {
      font-size: 32px;
      color: white;
    }
    .child:nth-child(1)::before { content: "1"; }
    .child:nth-child(2)::before { content: "2"; }
    .child:nth-child(3)::before { content: "3"; }
  </style>
  
  <!-- 주석 처리 오류 수정: 열린 주석을 정상적으로 닫았습니다. -->

  <!-- 
  <link rel="stylesheet" href="css/ex2-61-a.css">
  -->

 <!--  <link rel="stylesheet" href="css/ex2-61-b.css">  -->
  <!--  <link rel="stylesheet" href="css/ex2-61-c.css"> -->
	<link rel="stylesheet" href="css/ex2-61-d.css">
</head>
<body>
  <div class="parent">
    <div class="child red"></div>
    <div class="child green"></div>
    <div class="child blue"></div>
  </div>
</body>
</html>
