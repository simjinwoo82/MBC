
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 식탁 | 감성 레시피 20종</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Sans-serif&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Serif KR', serif; color: #333; background-color: #FCFBF9; line-height: 1.6; }
        header { display: flex; justify-content: center; align-items: center; padding: 40px 0; background-color: #FCFBF9; border-bottom: 1px solid #EFEBE4; }
        .logo { font-size: 32px; font-weight: 700; color: #5C6E58; letter-spacing: -1px; }

        .category-tabs { display: flex; justify-content: center; gap: 15px; margin: 30px 0; flex-wrap: wrap; }
        .tab-btn { font-family: sans-serif; padding: 12px 20px; border: 1px solid #EFEBE4; background: #fff; border-radius: 30px; cursor: pointer; transition: 0.3s; color: #666; font-weight: bold; }
        .tab-btn.active, .tab-btn:hover { background: #5C6E58; color: #fff; border-color: #5C6E58; }

        .container { max-width: 1200px; margin: 0 auto 100px; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }

        .card { background: #fff; border-radius: 12px; overflow: hidden; border: 1px solid #F0EFEA; cursor: pointer; transition: 0.3s; }
        .card:hover { transform: translateY(-8px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .card-img { height: 220px; background-size: cover; background-position: center; transition: 0.5s; }
        .card-content { padding: 20px; }
        .card-tag { font-size: 11px; color: #A39683; letter-spacing: 1px; margin-bottom: 5px; display: block; }
        .card-title { font-size: 19px; margin-bottom: 8px; color: #222; }
        .card-desc { font-size: 14px; color: #777; font-family: sans-serif; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* 모달 스타일 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9999; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: #fff; max-width: 700px; width: 100%; max-height: 90vh; border-radius: 15px; overflow-y: auto; position: relative; }
        .modal-close { position: absolute; top: 20px; right: 20px; font-size: 35px; color: #fff; cursor: pointer; text-shadow: 0 2px 4px rgba(0,0,0,0.5); z-index: 10; }
        .modal-img { height: 350px; background-size: cover; background-position: center; }
        .modal-body { padding: 40px; }
        .modal-title { font-size: 28px; margin-bottom: 15px; }
        .modal-section { margin-top: 25px; border-top: 1px solid #eee; padding-top: 15px; }
        .modal-subtitle { font-size: 18px; color: #5C6E58; font-weight: bold; margin-bottom: 10px; }
        .modal-text { font-family: sans-serif; white-space: pre-line; color: #444; line-height: 1.8; }

        footer { background: #F3F1EC; padding: 50px 20px; text-align: center; border-top: 1px solid #EFEBE4; }
        footer p { font-size: 13px; color: #999; font-family: sans-serif; }
    </style>
</head>
<body>

<header>
    <div class="logo">오늘의 식탁</div>
</header>

<div class="category-tabs">
    <button class="tab-btn active" onclick="filterMenu('all')">전체보기 (20)</button>
    <button class="tab-btn" onclick="filterMenu('salad')">샐러드</button>
    <button class="tab-btn" onclick="filterMenu('pasta')">파스타</button>
    <button class="tab-btn" onclick="filterMenu('pizza')">피자</button>
    <button class="tab-btn" onclick="filterMenu('steak')">스테이크</button>
</div>

<main class="container">
    <div class="grid" id="menu-grid"></div>
</main>

<div class="modal" id="modal" onclick="closeModal(event)">
    <div class="modal-content">
        <span class="modal-close" onclick="document.getElementById('modal').style.display='none'">&times;</span>
        <div class="modal-img" id="m-img"></div>
        <div class="modal-body">
            <h2 class="modal-title" id="m-title"></h2>
            <div class="modal-section">
                <div class="modal-subtitle">준비물</div>
                <p class="modal-text" id="m-ing"></p>
            </div>
            <div class="modal-section">
                <div class="modal-subtitle">레시피</div>
                <p class="modal-text" id="m-step"></p>
            </div>
        </div>
    </div>
</div>

<footer>
    <p>© 2026 오늘의 식탁. 저작권 없는 무료 이미지(Unsplash)와 오픈소스 코드로 제작되었습니다.</p>
</footer>

<script>
const recipes = [
    // --- 샐러드 (Salad) ---
    { id: 1, cat: 'salad', tag: 'Fresh Salad', title: '리코타 치즈 샐러드', desc: '상큼한 계절 과일과 고소한 리코타 치즈가 어우러진 브런치 인기 메뉴.', img: 'https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=600', ing: '믹스채소 100g, 리코타치즈 3큰술, 방울토마토 5개, 견과류, 발사믹 글레이즈', step: '1. 채소는 씻어 물기를 제거합니다.\n2. 접시에 채소를 깔고 리코타 치즈를 큼직하게 떼어 올립니다.\n3. 토마토와 견과류를 뿌린 뒤 발사믹 소스를 두릅니다.' },
    { id: 2, cat: 'salad', tag: 'Fresh Salad', title: '훈제연어 샐러드', desc: '훈제 연어의 풍미와 아삭한 양파 슬라이스가 돋보이는 고급 샐러드.', img: 'https://images.unsplash.com/photo-1467003909585-2f8a72700288?w=600', ing: '훈제연어 150g, 양파 1/4개, 케이퍼, 홀래디쉬 드레싱, 레몬즙', step: '1. 양파는 얇게 채 썰어 찬물에 담가 매운맛을 뺍니다.\n2. 연어를 한입 크기로 접시에 돌려 담습니다.\n3. 양파와 케이퍼를 올리고 드레싱과 레몬즙을 뿌려 완성합니다.' },
    { id: 3, cat: 'salad', tag: 'Fresh Salad', title: '클래식 시저 샐러드', desc: '로메인의 아삭함과 짭짤한 베이컨, 시저 드레싱의 고소한 하모니.', img: 'https://images.unsplash.com/photo-1550304943-4f24f54ddde9?w=600', ing: '로메인 상추 한 줌, 크루통, 베이컨 2줄, 파마산 치즈가루, 시저 드레싱', step: '1. 로메인은 큼직하게 썰고 베이컨은 바삭하게 굽습니다.\n2. 볼에 모든 재료를 넣고 소스에 버무립니다.\n3. 마지막에 치즈 가루를 듬뿍 뿌려 풍미를 더합니다.' },
    { id: 4, cat: 'salad', tag: 'Fresh Salad', title: '그릭 샐러드', desc: '오이, 토마토, 올리브와 페타 치즈로 만든 건강한 지중해식 샐러드.', img: 'https://images.unsplash.com/photo-1540420753464-3304b6085d5e?w=600', ing: '오이 1/2개, 토마토 1개, 블랙올리브 5알, 페타치즈 50g, 올리브유, 허브', step: '1. 오이와 토마토를 깍둑썰기합니다.\n2. 블랙올리브와 페타 치즈를 넣고 올리브유를 넉넉히 두릅니다.\n3. 소금, 후추, 말린 허브를 뿌려 가볍게 섞습니다.' },
    { id: 5, cat: 'salad', tag: 'Fresh Salad', title: '구운 버섯 샐러드', desc: '발사믹에 볶은 쫄깃한 버섯을 올린 따뜻한 샐러드(웜 샐러드).', img: 'https://images.unsplash.com/photo-1604908176997-125f25cc6f3d?w=600', ing: '양송이버섯 4개, 느타리버섯 조금, 어린잎 채소, 발사믹 식초, 간장 1작은술', step: '1. 버섯을 먹기 좋게 썰어 팬에 올리브유와 함께 볶습니다.\n2. 간장과 발사믹 식초로 살짝 졸이듯 볶아 풍미를 냅니다.\n3. 신선한 채소 위에 볶은 버섯을 따뜻할 때 올려 냅니다.' },

    // --- 파스타 ---
    { id: 6, cat: 'pasta', tag: 'Pasta', title: '알리오 올리오', desc: '마늘과 올리브유로 맛을 낸 정통 오일 파스타.', img: 'https://images.unsplash.com/photo-1673332560505-181cb2ee1c0a?w=600', ing: '스파게티면, 마늘 7쪽, 페페론치노 3개, 올리브유 50ml, 소금', step: '1. 면을 삶습니다.\n2. 오일에 마늘과 고추를 볶아 향을 냅니다.\n3. 면과 면수를 넣고 빠르게 볶아 소스를 유화시킵니다.' },
    { id: 7, cat: 'pasta', tag: 'Pasta', title: '트러플 크림 파스타', desc: '진한 크림 소스에 트러플 향이 가득한 고급 파스타.', img: 'https://images.unsplash.com/photo-1621996346565-e3bb6463591e?w=600', ing: '페투치네면, 생크림 200ml, 트러플 오일, 버섯, 베이컨', step: '1. 버섯과 베이컨을 볶습니다.\n2. 생크림을 넣고 끓이다가 삶은 면을 넣습니다.\n3. 불을 끄고 트러플 오일을 둘러 완성합니다.' },
    { id: 8, cat: 'pasta', tag: 'Pasta', title: '해산물 토마토 파스타', desc: '신선한 조개와 새우가 들어간 매콤 상큼한 파스타.', img: 'https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?w=600', ing: '면, 토마토소스, 새우 4마리, 바지락, 화이트와인', step: '1. 팬에 해산물을 볶다 와인으로 잡내를 잡습니다.\n2. 토마토 소스를 붓고 끓입니다.\n3. 면을 넣어 소스가 배게 졸입니다.' },
    { id: 9, cat: 'pasta', tag: 'Pasta', title: '바질 페스토 파스타', desc: '바질 향이 입안을 감싸는 향긋한 초록 파스타.', img: 'https://images.unsplash.com/photo-1540189549336-e6e99c3679fe?w=600', ing: '면, 바질페스토 2큰술, 잣, 방울토마토, 올리브유', step: '1. 면을 삶아 준비합니다.\n2. 불을 끈 팬에서 면과 페스토를 섞습니다. (열에 약함)\n3. 토핑을 올려 완성합니다.' },
    { id: 10, cat: 'pasta', tag: 'Pasta', title: '봉골레 파스타', desc: '바지락의 시원한 육수가 일품인 오일 파스타.', img: 'https://images.unsplash.com/photo-1612874742237-6526221588e3?w=600', ing: '면, 바지락 200g, 마늘, 화이트와인, 페페론치노', step: '1. 마늘 오일에 조개를 넣고 와인을 부어 입을 벌리게 합니다.\n2. 조개 육수에 면을 넣고 소스가 잘 묻도록 볶습니다.' },

    // --- 피자 ---
    { id: 11, cat: 'pizza', tag: 'Pizza', title: '마르게리따 피자', desc: '치즈, 바질, 토마토의 완벽한 밸런스.', img: 'https://images.unsplash.com/photo-1604382354936-07c5d9983bd3?w=600', ing: '도우, 토마토소스, 생모짜렐라, 바질, 올리브유', step: '1. 도우에 소스와 치즈를 올립니다.\n2. 200도 오븐에 10분 굽습니다.\n3. 바질을 올려 마무리합니다.' },
    { id: 12, cat: 'pizza', tag: 'Pizza', title: '고르곤졸라 피자', desc: '꿀에 찍어 먹는 고소하고 달콤한 치즈 피자.', img: 'https://images.unsplash.com/photo-1513104890138-7c749659a591?w=600', ing: '도우, 모짜렐라, 고르곤졸라치즈, 꿀, 마늘칩', step: '1. 마늘 소스를 바르고 두 종류의 치즈를 듬뿍 올립니다.\n2. 노릇하게 굽고 꿀을 곁들입니다.' },
    { id: 13, cat: 'pizza', tag: 'Pizza', title: '페퍼로니 피자', desc: '햄이 듬뿍 들어간 짭짤한 정통 아메리칸 스타일.', img: 'https://images.unsplash.com/photo-1628840042765-356cda07504e?w=600', ing: '도우, 토마토소스, 모짜렐라, 페퍼로니 가득', step: '1. 페퍼로니를 겹치듯 빽빽하게 올리는 것이 핵심입니다.\n2. 오븐에서 바삭하게 구워냅니다.' },
    { id: 14, cat: 'pizza', tag: 'Pizza', title: '루콜라 프로슈토 피자', desc: '신선한 채소와 프로슈토 햄의 고급스러운 조화.', img: 'https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=600', ing: '도우, 치즈, 루콜라 한줌, 프로슈토 슬라이스', step: '1. 치즈 피자를 먼저 굽습니다.\n2. 그 위에 생루콜라와 프로슈토를 얹어 신선하게 즐깁니다.' },
    { id: 15, cat: 'pizza', tag: 'Pizza', title: '갈릭 쉬림프 피자', desc: '마늘과 새우가 만나 감칠맛이 폭발하는 피자.', img: 'https://images.unsplash.com/photo-1534308983496-4fabb1a015ee?w=600', ing: '도우, 화이트소스, 새우, 구운마늘칩, 파인애플(선택)', step: '1. 화이트 소스 베이스에 밑간한 새우를 올립니다.\n2. 구운 뒤 마늘칩을 뿌려 식감을 살립니다.' },

    // --- 스테이크 ---
    { id: 16, cat: 'steak', tag: 'Steak', title: '등심 스테이크', desc: '육즙 가득한 립아이 스테이크의 정석.', img: 'https://images.unsplash.com/photo-1606416132922-32c377617053?w=600', ing: '소고기 등심 300g, 버터, 로즈마리, 통마늘', step: '1. 고기를 시어링(강하게 굽기) 합니다.\n2. 버터 아로제를 통해 풍미를 입힙니다.\n3. 5분간 레스팅 후 썹니다.' },
    { id: 17, cat: 'steak', tag: 'Steak', title: '안심 스테이크', desc: '세상에서 가장 부드러운 한 조각.', img: 'https://images.unsplash.com/photo-1544025162-d76694265947?w=600', ing: '안심 블록, 소금, 후추, 올리브유', step: '1. 두꺼운 안심을 취향껏 굽습니다.\n2. 미디엄 레어를 추천하며 부드러운 매쉬드 포테이토와 잘 어울립니다.' },
    { id: 18, cat: 'steak', tag: 'Steak', title: '찹 스테이크', desc: '야채와 고기를 특제 소스에 볶아낸 요리.', img: 'https://images.unsplash.com/photo-1532550907401-a500c9a57435?w=600', ing: '고기, 파프리카, 양파, 돈가스소스 2큰술, 굴소스 1큰술', step: '1. 고기와 야채를 사각으로 썹니다.\n2. 고기를 먼저 볶다 야채와 소스를 넣고 강불에 빠르게 볶습니다.' },
    { id: 19, cat: 'steak', tag: 'Steak', title: '토마호크 스테이크', desc: '캠핑과 파티에 어울리는 웅장한 비주얼.', img: 'https://images.unsplash.com/photo-1615937657715-bc7b4b7962c1?w=600', ing: '토마호크 1kg, 버터 듬뿍, 가니쉬 야채', step: '1. 고기가 크므로 충분히 시즈닝합니다.\n2. 오븐이나 두꺼운 팬에 겉면을 바삭하게 익히고 속은 서서히 익힙니다.' },
    { id: 20, cat: 'steak', tag: 'Steak', title: '치킨 스테이크', desc: '겉바속촉, 닭다리살로 만든 부드러운 스테이크.', img: 'https://images.unsplash.com/photo-1532550907401-a500c9a57435?w=600', ing: '닭다리살 2개, 로즈마리, 레몬즙, 소금', step: '1. 닭 껍질부터 바삭하게 굽습니다.\n2. 기름을 닦아가며 속까지 익힌 뒤 소스를 곁들입니다.' }
];

function init() {
    const grid = document.getElementById('menu-grid');
    grid.innerHTML = recipes.map(r => `
        <div class="card ${r.cat}" onclick="openModal(${r.id})">
            <div class="card-img" style="background-image: url('${r.img}')"></div>
            <div class="card-content">
                <span class="card-tag">${r.tag}</span>
                <h3 class="card-title">${r.title}</h3>
                <p class="card-desc">${r.desc}</p>
            </div>
        </div>
    `).join('');
}

function filterMenu(cat) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    document.querySelectorAll('.card').forEach(c => {
        c.style.display = (cat === 'all' || c.classList.contains(cat)) ? 'block' : 'none';
    });
}

function openModal(id) {
    const r = recipes.find(x => x.id === id);
    document.getElementById('m-img').style.backgroundImage = `url('${r.img}')`;
    document.getElementById('m-title').innerText = r.title;
    document.getElementById('m-ing').innerText = r.ing;
    document.getElementById('m-step').innerText = r.step;
    document.getElementById('modal').style.display = 'flex';
}

function closeModal(e) {
    if(e.target === document.getElementById('modal')) document.getElementById('modal').style.display='none';
}

init();
</script>
</body>
</html>
